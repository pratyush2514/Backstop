name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Gateway tests
        working-directory: gateway
        run: CGO_ENABLED=0 go test ./... -count=1

      - name: Sync tests
        working-directory: sync
        run: CGO_ENABLED=0 go test ./... -count=1

      - name: Python install
        working-directory: sdk/python
        run: python -m pip install -e .[dev]

      - name: Python tests
        working-directory: sdk/python
        run: python -m pytest tests -q

      - name: Node install
        run: npm ci

      - name: Node SDK and MCP tests
        run: npm test

      - name: Node package dry run
        run: npm run pack:check

      - name: Compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Portable E2E script help
        run: node scripts/e2e.mjs --help

      - name: Docker build gateway
        run: docker build -t backstop-gateway:test gateway

      - name: Docker build sync
        run: docker build -t backstop-sync:test sync

