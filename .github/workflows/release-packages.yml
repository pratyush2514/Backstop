name: release-packages

on:
  workflow_dispatch:
    inputs:
      publish_node:
        description: "Publish @backstop/client and @backstop/mcp-server to npm"
        required: false
        default: true
        type: boolean
      publish_python:
        description: "Publish the Python backstop package to PyPI"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  publish-node:
    if: github.event_name == 'push' || inputs.publish_node == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish @backstop/client
        working-directory: packages/node-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Publish @backstop/mcp-server
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish-python:
    if: github.event_name == 'push' || inputs.publish_python == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/backstop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        working-directory: sdk/python
        run: python -m pip install --upgrade build twine

      - name: Build package
        working-directory: sdk/python
        run: python -m build

      - name: Check distributions
        working-directory: sdk/python
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

