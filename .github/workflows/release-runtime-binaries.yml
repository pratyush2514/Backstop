name: release-runtime-binaries

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref to build from (branch, commit, or tag like v0.1.0-alpha.1)"
        required: false
        default: "main"
        type: string
      release_tag:
        description: "Existing GitHub release tag to upload assets to"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            goos: linux
            goarch: amd64
          - service: gateway
            goos: linux
            goarch: arm64
          - service: gateway
            goos: darwin
            goarch: amd64
          - service: gateway
            goos: darwin
            goarch: arm64
          - service: gateway
            goos: windows
            goarch: amd64
          - service: sync
            goos: linux
            goarch: amd64
          - service: sync
            goos: linux
            goarch: arm64
          - service: sync
            goos: darwin
            goarch: amd64
          - service: sync
            goos: darwin
            goarch: arm64
          - service: sync
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build runtime binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          os_label="${{ matrix.goos }}"
          if [ "$os_label" = "windows" ]; then
            os_label="windows"
            ext=".exe"
          else
            ext=""
          fi
          arch_label="${{ matrix.goarch }}"
          output="dist/backstop-${{ matrix.service }}-${os_label}-${arch_label}${ext}"
          pushd "./${{ matrix.service }}" >/dev/null
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 go build -o "../$output" .
          popd >/dev/null

      - name: Upload runtime asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          files: dist/*
          fail_on_unmatched_files: true
