name: release-runtime-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            goos: linux
            goarch: amd64
          - service: gateway
            goos: linux
            goarch: arm64
          - service: gateway
            goos: darwin
            goarch: amd64
          - service: gateway
            goos: darwin
            goarch: arm64
          - service: gateway
            goos: windows
            goarch: amd64
          - service: sync
            goos: linux
            goarch: amd64
          - service: sync
            goos: linux
            goarch: arm64
          - service: sync
            goos: darwin
            goarch: amd64
          - service: sync
            goos: darwin
            goarch: arm64
          - service: sync
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build runtime binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          os_label="${{ matrix.goos }}"
          if [ "$os_label" = "windows" ]; then
            os_label="windows"
            ext=".exe"
          else
            ext=""
          fi
          arch_label="${{ matrix.goarch }}"
          output="dist/backstop-${{ matrix.service }}-${os_label}-${arch_label}${ext}"
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 go build -o "$output" "./${{ matrix.service }}"

      - name: Upload runtime asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          fail_on_unmatched_files: true
