services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    depends_on:
      - minio
      - create-bucket
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      PYTHONIOENCODING: UTF-8
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=backstop wal archive --storage s3://backstop-test@http://minio:9000 --cluster-id local --wal-file %p --wal-name %f
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed.sql:/seed/seed.sql:ro

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      mc mb --ignore-existing local/backstop-test
      "

  backstop-sync:
    build:
      context: ../sync
    depends_on:
      - postgres
      - minio
      - create-bucket
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - backstop-metadata:/metadata
    command:
      - --db
      - postgresql://postgres:password@postgres:5432/testdb?sslmode=disable
      - --storage
      - s3://backstop-test@http://minio:9000
      - --interval
      - "30"
      - --schema
      - public
      - --metadata-db
      - /metadata/backstop.db
      - --metrics-listen
      - :9091
      - --max-snapshot-age
      - 5m
      - --bypass-detection=true
      - --agent-roles
      - postgres
      - --gateway-application-name
      - backstop-gateway
    ports:
      - "9091:9091"

  backstop-gateway:
    build:
      context: ../gateway
    depends_on:
      - postgres
      - minio
      - create-bucket
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BACKSTOP_GATEWAY_AUTH_TOKEN: dev-token
      BACKSTOP_GATEWAY_AUDIT_LOG: /data/audit.jsonl
    volumes:
      - gateway-audit:/data
      - backstop-metadata:/metadata
    command:
      - --listen
      - :8080
      - --db
      - postgresql://postgres:password@postgres:5432/testdb?sslmode=disable&application_name=backstop-gateway
      - --storage
      - s3://backstop-test@http://minio:9000
      - --snapshot-before-critical=true
      - --auth-token
      - dev-token
      - --audit-log
      - /data/audit.jsonl
      - --metadata-db
      - /metadata/backstop.db
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  minio-data:
  gateway-audit:
  backstop-metadata:

