services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      PYTHONIOENCODING: UTF-8
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=backstop wal archive --storage s3://backstop-test@http://minio:9000 --cluster-id local --wal-file %p --wal-name %f
    ports:
      - "${BACKSTOP_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${BACKSTOP_MINIO_HOST_PORT:-9000}:9000"
      - "${BACKSTOP_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  create-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      mc mb --ignore-existing local/backstop-test
      "

  backstop-sync:
    build:
      context: ../sync
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - backstop-metadata:/metadata
    command:
      - --db
      - postgresql://postgres:password@postgres:5432/testdb?sslmode=disable
      - --storage
      - s3://backstop-test@http://minio:9000
      - --interval
      - "30"
      - --schema
      - public
      - --metadata-db
      - /metadata/backstop.db
      - --metrics-listen
      - :9091
      - --max-snapshot-age
      - 5m
      - --bypass-detection=true
      - --agent-roles
      - postgres
      - --gateway-application-name
      - backstop-gateway
      - --snapshot-startup-grace
      - 20s
      - --snapshot-stable-polls
      - "2"
    ports:
      - "${BACKSTOP_SYNC_HOST_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "/usr/local/bin/backstop-sync", "--healthcheck", "http://localhost:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backstop-gateway:
    build:
      context: ../gateway
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      backstop-sync:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BACKSTOP_GATEWAY_AUTH_TOKEN: dev-token
      BACKSTOP_GATEWAY_AUDIT_LOG: /data/audit.jsonl
    volumes:
      - gateway-audit:/data
      - backstop-metadata:/metadata
    command:
      - --listen
      - :8080
      - --db
      - postgresql://postgres:password@postgres:5432/testdb?sslmode=disable&application_name=backstop-gateway
      - --storage
      - s3://backstop-test@http://minio:9000
      - --snapshot-before-critical=true
      - --auth-token
      - dev-token
      - --audit-log
      - /data/audit.jsonl
      - --metadata-db
      - /metadata/backstop.db
    ports:
      - "${BACKSTOP_GATEWAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/backstop-gateway", "--healthcheck", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
  gateway-audit:
  backstop-metadata:
